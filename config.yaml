data:
  raw_path: "artifact/Mall_Customers.csv"
  processed_path: "artifact/processed_data.pkl"
  train_test_split_ratio: 0.2
  
model:
  name: "KMeans"
  params:
    n_clusters: 5
    init: "k-means++"
    random_state: 42
    n_init: 10
    max_iter: 300

features:
  numerical: ["Age", "Annual Income (k$)", "Spending Score (1-100)"]
  categorical: ["Gender"]
  
preprocessing:
  scaler_type: "StandardScaler"
  encoder_type: "OneHotEncoder"
  handle_missing: "mean"

paths:
  artifact_dir: "artifact"
  model_file: "artifact/model.pkl"
  preprocessor_file: "artifact/preprocessor.pkl"
  logs_dir: "logs"
  
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
